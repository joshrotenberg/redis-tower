[package]
name = "redis-tower-redis-rs-migration"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.88"

[dependencies]
bytes = "=1.12.1"
redis = { version = "=1.7.0", default-features = false, features = ["tokio-comp"] }
redis-tower = { version = "=0.1.3", default-features = false }
redis-tower-commands = "=0.1.2"
redis-tower-core = "=0.1.2"
redis-tower-protocol = "=0.1.3"
redis-tower-cluster = "=0.1.3"
redis-tower-sentinel = "=0.1.3"

# Keep this registry-compatibility harness independent from the repository
# workspace so path dependencies cannot mask a published-API mismatch.
[workspace]
