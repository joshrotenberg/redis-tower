name: Weekly Benchmarks

on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-benchmarks
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REDIS_VERSION: "8.0.6"
  # 3 payloads x 3 concurrency levels x 5-6 clients, plus setup, stays well
  # inside each job's 45-minute budget while preserving three repeated runs.
  BENCH_SECS: "3"
  BENCH_WARMUP: "1"
  BENCH_RUNS: "3"
  BENCH_CONCURRENCY: "1,32,128"
  BENCH_PAYLOAD_SIZES: "64,1024,16384"

jobs:
  comparison:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package:
          - standalone-bench
          - cluster-bench

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: weekly-${{ matrix.package }}

      - name: Cache Redis build
        uses: actions/cache@v4
        with:
          path: ~/redis
          key: benchmark-redis-${{ env.REDIS_VERSION }}-${{ runner.os }}

      - name: Build Redis
        run: |
          if [ ! -f ~/redis/bin/redis-server ]; then
            cd /tmp
            curl -fsSL https://github.com/redis/redis/archive/refs/tags/${REDIS_VERSION}.tar.gz | tar xz
            cd redis-${REDIS_VERSION}
            make -j$(nproc)
            mkdir -p ~/redis/bin
            cp src/redis-server src/redis-cli ~/redis/bin/
          fi
          echo "$HOME/redis/bin" >> $GITHUB_PATH

      - name: Run comparison benchmark
        run: |
          mkdir -p benchmark-results
          redis-server --version > benchmark-results/redis-version.txt
          rustc -Vv > benchmark-results/rust-version.txt
          cargo run -p ${{ matrix.package }} --release -- --json \
            > benchmark-results/${{ matrix.package }}.json
          if [ "${{ matrix.package }}" = "cluster-bench" ]; then
            BENCH_SCENARIO=replica cargo run -p cluster-bench --release -- --json \
              > benchmark-results/cluster-bench-replica.json
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ github.run_id }}
          path: benchmark-results
          retention-days: 90

  resource-footprint:
    name: resource-footprint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REDIS_URL: redis://127.0.0.1:6481/
      RESOURCE_CONNECTIONS: "16"
      RESOURCE_TARGET_OPS_PER_SEC: "500"
      RESOURCE_WARMUP_SECS: "1"
      RESOURCE_DURATION_SECS: "2"
      RESOURCE_PAYLOAD_BYTES: "1024"
      RESOURCE_BUILD_RUNS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: weekly-resource-footprint

      - name: Cache Redis build
        uses: actions/cache@v4
        with:
          path: ~/redis
          key: benchmark-redis-${{ env.REDIS_VERSION }}-${{ runner.os }}

      - name: Build Redis
        run: |
          if [ ! -f ~/redis/bin/redis-server ]; then
            cd /tmp
            curl -fsSL https://github.com/redis/redis/archive/refs/tags/${REDIS_VERSION}.tar.gz | tar xz
            cd redis-${REDIS_VERSION}
            make -j$(nproc)
            mkdir -p ~/redis/bin
            cp src/redis-server src/redis-cli ~/redis/bin/
          fi
          echo "$HOME/redis/bin" >> $GITHUB_PATH

      - name: Run isolated resource probes
        run: |
          mkdir -p resource-results
          redis-server --port 6481 --save '' --appendonly no --daemonize yes
          cleanup() { redis-cli -p 6481 shutdown nosave >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 50); do
            if redis-cli -p 6481 ping >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          redis-cli -p 6481 ping >/dev/null
          redis-server --version > resource-results/redis-version.txt
          rustc -Vv > resource-results/rust-version.txt

          cargo run -p resource-bench --release \
            --no-default-features --features client-redis-tower \
            --bin resource-redis-tower -- --json \
            > resource-results/redis-tower.json
          cargo run -p resource-bench --release \
            --no-default-features --features client-redis-rs \
            --bin resource-redis-rs -- --json \
            > resource-results/redis-rs.json
          cargo run -p resource-bench --release \
            --no-default-features --features client-fred \
            --bin resource-fred -- --json \
            > resource-results/fred.json
          cargo run -p resource-bench --release \
            --bin resource-build-measure -- --json \
            > resource-results/build-footprint.json

      - name: Upload resource probe results
        uses: actions/upload-artifact@v4
        with:
          name: resource-footprint-${{ github.run_id }}
          path: resource-results
          retention-days: 90
