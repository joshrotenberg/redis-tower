name: Nightly Module Tests

# Runs the `#[ignore]`d redis-tower-modules integration suites (JSON, Search,
# TimeSeries, probabilistic, Vector, and the redis-rs differential) against real
# Redis servers that ship the modules. The main CI Redis is built without
# modules. A bounded Redis 8 module gate now runs for relevant pull requests;
# this nightly job retains the broader Redis 8 / Redis Stack 7.x matrix.
#
# Two legs:
#   - redis:8           bundles all former Stack modules natively, and Vector
#                       Sets require Redis 8.0+, so this leg runs every suite.
#   - redis-stack 7.x   covers the 7.x module line (no Vector Sets), so it runs
#                       the four non-vector suites.
#
# The suites read REDIS_URL (default redis://127.0.0.1:6399) and need no
# test-code changes -- pointing them at a module-enabled server is enough.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REDIS_URL: redis://127.0.0.1:6399

jobs:
  modules:
    name: Module Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: redis-8
            image: redis:8
            test-args: "--all-features"
            capability-test-args: "--all-features"
            minimum-version: "8.0.0"
            required-commands: "JSON.SET,FT.CREATE,TS.CREATE,BF.ADD,VADD"
          - name: redis-stack-7.x
            image: redis/redis-stack-server:7.4.0-v3
            test-args: >-
              --features json,search,timeseries,probabilistic
              --test json_integration
              --test search_integration
              --test timeseries_integration
              --test probabilistic_integration
            capability-test-args: "--features json,search,timeseries,probabilistic"
            minimum-version: "7.4.0"
            required-commands: "JSON.SET,FT.CREATE,TS.CREATE,BF.ADD"
    services:
      redis:
        image: ${{ matrix.image }}
        ports:
          - 6399:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-modules

      - name: Prove server version and required commands
        env:
          REDIS_MODULE_MIN_VERSION: ${{ matrix.minimum-version }}
          REDIS_MODULE_COMMANDS: ${{ matrix.required-commands }}
        run: >-
          cargo test -p redis-tower-modules
          ${{ matrix.capability-test-args }} --test capabilities
          required_server_version_and_commands_are_present --
          --ignored --exact --nocapture

      - name: Run module integration tests
        run: cargo test -p redis-tower-modules ${{ matrix.test-args }} -- --ignored
