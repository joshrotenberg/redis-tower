[package]
name = "redis-tower-examples"
version = "0.0.0"
edition.workspace = true
publish = false

[features]
# On by default so `cargo run --example tls` works out of the box; disable with
# `--no-default-features` to skip the TLS example and its rustls dependency.
default = ["tls"]
tls = ["redis-tower/tls-rustls"]
prometheus = ["redis-tower/metrics", "dep:metrics-exporter-prometheus"]
otel = [
    "redis-tower/metrics",
    "dep:metrics-opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-stdout",
]

[dependencies]
redis-tower = { workspace = true, features = ["serde"] }
redis-tower-core = { workspace = true }
redis-tower-commands = { workspace = true }
redis-tower-cluster = { workspace = true }
redis-tower-sentinel = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-stream = { workspace = true }
tower = { workspace = true }
tower-service = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"], optional = true }
metrics-opentelemetry = { version = "0.24032.8", optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics"], optional = true }
opentelemetry-stdout = { version = "0.32", default-features = false, features = ["metrics"], optional = true }

[[example]]
name = "basic"
path = "basic.rs"

[[example]]
name = "pipeline"
path = "pipeline.rs"

[[example]]
name = "transaction"
path = "transaction.rs"

[[example]]
name = "pubsub"
path = "pubsub.rs"

[[example]]
name = "tower_middleware"
path = "tower_middleware.rs"

[[example]]
name = "reconnect"
path = "reconnect.rs"

[[example]]
name = "resilience"
path = "resilience.rs"

[[example]]
name = "shared_client"
path = "shared_client.rs"

[[example]]
name = "streams"
path = "streams.rs"

[[example]]
name = "script"
path = "script.rs"

[[example]]
name = "auto_pipeline"
path = "auto_pipeline.rs"

[[example]]
name = "connection_pool"
path = "connection_pool.rs"

[[example]]
name = "cluster"
path = "cluster.rs"

[[example]]
name = "sentinel"
path = "sentinel.rs"

[[example]]
name = "json_api"
path = "json_api.rs"

[[example]]
name = "tls"
path = "tls.rs"
required-features = ["tls"]

[[example]]
name = "prometheus"
path = "prometheus.rs"
required-features = ["prometheus"]

[[example]]
name = "otel"
path = "otel.rs"
required-features = ["otel"]
