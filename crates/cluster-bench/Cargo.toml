[package]
name = "cluster-bench"
version = "0.0.0"
edition.workspace = true
publish = false

[[bin]]
name = "cluster-bench"
path = "src/main.rs"

[dependencies]
redis-tower = { path = "../redis-tower", default-features = false }
redis-tower-cluster = { path = "../redis-tower-cluster" }
redis-tower-commands = { path = "../redis-tower-commands", default-features = false }
redis-tower-core = { path = "../redis-tower-core" }
redis-tower-protocol = { path = "../redis-tower-protocol" }
redis-tower-test = { path = "../redis-test-harness" }
redis-server-wrapper = { workspace = true }

redis = { version = "1.2", features = ["cluster", "cluster-async", "tokio-comp"] }
fred = { version = "10.1", default-features = false, features = ["i-keys"] }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
bytes = { workspace = true }
futures = { workspace = true }
hdrhistogram = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
