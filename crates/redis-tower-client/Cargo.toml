[package]
name = "redis-tower-client"
version = "0.1.0"
description = "Unified Redis client (standalone, cluster, sentinel) for redis-tower"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["redis", "cluster", "sentinel", "tower"]
categories = ["database", "asynchronous", "network-programming"]

[features]
default = []
# Forward TLS backends so `rediss://`, `rediss+cluster://`, and
# `rediss+sentinel://` URLs can establish TLS connections. Without one of
# these, a `rediss` URL returns an error rather than connecting in plaintext.
tls-rustls = [
    "redis-tower/tls-rustls",
    "redis-tower-cluster/tls-rustls",
    "redis-tower-sentinel/tls-rustls",
]
tls-native-tls = [
    "redis-tower/tls-native-tls",
    "redis-tower-cluster/tls-native-tls",
    "redis-tower-sentinel/tls-native-tls",
]

[dependencies]
redis-tower = { workspace = true, default-features = false }
redis-tower-core = { workspace = true }
redis-tower-cluster = { workspace = true }
redis-tower-sentinel = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
redis-tower-commands = { workspace = true }
bytes = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
redis-server-wrapper = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
