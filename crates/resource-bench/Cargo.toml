[package]
name = "resource-bench"
version = "0.0.0"
description = "Process-isolated resource-footprint probes for Redis Rust clients"
edition.workspace = true
publish = false

[features]
default = []
client-redis-tower = ["dep:redis-tower"]
client-redis-rs = ["dep:redis"]
client-fred = ["dep:fred"]
build-measure = ["dep:ctrlc", "dep:sha2"]

[[bin]]
name = "resource-redis-tower"
path = "src/bin/redis_tower.rs"
required-features = ["client-redis-tower"]

[[bin]]
name = "resource-redis-rs"
path = "src/bin/redis_rs.rs"
required-features = ["client-redis-rs"]

[[bin]]
name = "resource-fred"
path = "src/bin/fred.rs"
required-features = ["client-fred"]

[[bin]]
name = "resource-build-measure"
path = "src/bin/build_measure.rs"
required-features = ["build-measure"]

[dependencies]
async-trait = "0.1"
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

redis-tower = { workspace = true, default-features = false, optional = true }
redis = { version = "1.2", default-features = false, features = ["tokio-comp"], optional = true }
fred = { version = "10.1", default-features = false, features = ["i-keys"], optional = true }
ctrlc = { version = "3.4", default-features = false, features = ["termination"], optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
