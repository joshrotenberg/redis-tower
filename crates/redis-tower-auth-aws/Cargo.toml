[package]
name = "redis-tower-auth-aws"
version = "0.1.0"
description = "AWS ElastiCache IAM credential provider for redis-tower"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["redis", "elasticache", "aws", "iam", "authentication"]
categories = ["authentication", "database"]

[dependencies]
async-stream = { workspace = true }
# Newer AWS SDK releases require Rust newer than the workspace's 1.88 MSRV.
# These are the newest compatible credential and SigV4 releases.
aws-credential-types = "=1.2.11"
aws-sigv4 = "=1.3.8"
http = "1"
redis-tower = { workspace = true, default-features = false }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
url = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
