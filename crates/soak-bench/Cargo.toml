[package]
name = "soak-bench"
version = "0.0.0"
description = "Hours-long constant-memory soak and chaos harness for redis-tower"
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[[bin]]
name = "soak-bench"
path = "src/main.rs"

[dependencies]
hdrhistogram = { workspace = true }
redis-server-wrapper = { workspace = true }
redis-tower = { path = "../redis-tower", default-features = false }
redis-tower-cluster = { path = "../redis-tower-cluster" }
redis-tower-commands = { path = "../redis-tower-commands", default-features = false }
redis-tower-test = { path = "../redis-test-harness" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
