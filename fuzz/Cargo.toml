[package]
name = "redis-tower-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1"
libfuzzer-sys = "0.4"
redis-tower-protocol = { path = "../crates/redis-tower-protocol" }
tokio-util = { version = "0.7", features = ["codec"] }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_chunked"
path = "fuzz_targets/decode_chunked.rs"
test = false
doc = false
bench = false

# Keep the fuzz package outside the release workspace.
[workspace]
members = ["."]
